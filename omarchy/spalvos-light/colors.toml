# Spalvos Light — Omarchy theme (v4 schema)
# Palette lifted from ../../ghostty/spalvos-light: the chromatic slots
# mirror the ANSI palette (normals = the 600/700 inks, brights = the
# 500/600 lifts). Accent = deep teal (spalvos "info/focus" tone);
# cursor cyan folded into bright_cyan. Spalvos has no orange/brown
# ramps, so those slots reuse amber steps (orange = amber-600,
# brown = amber-700). Every hex is a canon primitive.

mode = "light"

accent = "#087075"
selection = "#cbf2f4"
muted = "#73716e"

background = "#fbfbfa"
dark_background = "#f2f2f1"
darker_background = "#e8e8e6"
lighter_background = "#ffffff"

foreground = "#343331"
dark_foreground = "#73716e"
light_foreground = "#41403d"
bright_foreground = "#0b0a09"

red = "#b41b3c"
yellow = "#954d0a"
orange = "#c4660d"
green = "#13955e"
# cyan-700 (== accent), not the ghostty ANSI cyan-600 #0d959b: Omarchy paints
# the chromatic slots on all four declared surfaces, and cyan-600 lands at
# 2.96:1 on darker_background — a hair under the 3:1 the verifier enforces.
cyan = "#087075"
blue = "#2e49bd"
magenta = "#a70881"
brown = "#954d0a"

bright_red = "#de1c4a"
bright_yellow = "#c4660d"
bright_green = "#13955e"
bright_cyan = "#11bbc2"
bright_blue = "#3858e8"
bright_magenta = "#cd059e"
