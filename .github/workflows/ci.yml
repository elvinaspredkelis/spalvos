name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify palette, ports, and Tailwind variants
        run: bun test/verify-palette.mjs
      - name: Verify TUI port legibility
        run: bun test/verify-legibility.mjs
